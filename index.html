<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aktivasi Kartu Ulasan</title>
<style>
  :root{--bg:#f4f7f5;--card:#fff;--ink:#14201b;--mute:#5d6b64;--line:#d5ded9;--accent:#1b7f5c;--err:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#101714;--card:#18221d;--ink:#e8f0ec;--mute:#93a39b;--line:#2c3a33;--accent:#4cc596;--err:#ff8a80}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:420px;margin-top:8vh}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  h1{font-size:1.4rem;margin:0 0 6px;line-height:1.25}
  p{margin:0 0 16px;color:var(--mute)}
  label{display:block;font-weight:600;margin:16px 0 6px}
  input{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{width:100%;margin-top:20px;padding:13px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:10px;cursor:pointer}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-weight:600}
  .err{color:var(--err)} .ok{color:var(--accent)}
  .small{margin-top:18px;font-size:.9rem}
  a{color:var(--accent)}
</style>
</head>
<body>
<main><div class="box" id="app"><p>Memuat…</p></div></main>
<script>
const SUPABASE_URL = "https://nycanjxfidtdtyqaredq.supabase.co";
const SUPABASE_KEY = "sb_publishable_VP2AWKWxb41jS4f21z33Fg_vXZKGwzr";

const app = document.getElementById("app");

async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify(args)
  });
  if (!res.ok) throw new Error("Gagal terhubung ke server");
  return res.json();
}

function validUrl(u) {
  try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:"; }
  catch { return false; }
}

function go(url) { window.location.replace(url); }

function show(html) { app.innerHTML = html; }

function formView({ title, desc, fields, button, onSubmit, footer }) {
  show(`
    <h1>${title}</h1><p>${desc}</p>
    <form id="f" novalidate>
      ${fields.map(f => `<label for="${f.id}">${f.label}</label>
        <input id="${f.id}" type="${f.type}" placeholder="${f.ph || ""}" autocomplete="off" required>`).join("")}
      <button type="submit">${button}</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
    ${footer || ""}`);
  const form = document.getElementById("f");
  const msg = document.getElementById("msg");
  const btn = form.querySelector("button");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    msg.className = "msg"; msg.textContent = "";
    btn.disabled = true;
    try { await onSubmit(msg); }
    catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
    btn.disabled = false;
  });
}

const val = id => document.getElementById(id).value.trim();

async function activation(code) {
  formView({
    title: "Aktifkan kartu ini",
    desc: "Masukkan link Google Maps toko dan buat kode rahasia untuk mengubah link nanti.",
    fields: [
      { id: "url", label: "Link Google Maps toko", type: "url", ph: "https://maps.app.goo.gl/..." },
      { id: "secret", label: "Kode rahasia", type: "password", ph: "Minimal 4 karakter" }
    ],
    button: "Aktifkan kartu",
    onSubmit: async msg => {
      const url = val("url"), secret = val("secret");
      if (!validUrl(url)) throw new Error("Link tidak valid. Tempel link lengkap yang diawali https://");
      if (secret.length < 4) throw new Error("Kode rahasia minimal 4 karakter.");
      const ok = await rpc("activate_card", { p_code: code, p_url: url, p_secret: secret });
      if (!ok) throw new Error("Kartu ini sudah aktif.");
      msg.className = "msg ok"; msg.textContent = "Kartu aktif. Mengarahkan…";
      setTimeout(() => go(url), 700);
    }
  });
}

function editor(code) {
  formView({
    title: "Ubah link toko",
    desc: "Masukkan kode rahasia kartu dan link Google Maps yang baru.",
    fields: [
      { id: "secret", label: "Kode rahasia", type: "password" },
      { id: "url", label: "Link Google Maps baru", type: "url", ph: "https://maps.app.goo.gl/..." }
    ],
    button: "Simpan link baru",
    onSubmit: async msg => {
      const url = val("url"), secret = val("secret");
      if (!validUrl(url)) throw new Error("Link tidak valid. Tempel link lengkap yang diawali https://");
      const ok = await rpc("update_card", { p_code: code, p_secret: secret, p_url: url });
      if (!ok) throw new Error("Kode rahasia salah.");
      msg.className = "msg ok"; msg.textContent = "Link berhasil diubah.";
    }
  });
}

async function route() {
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] !== "c" || !parts[1]) {
    show(`<h1>Kartu Ulasan Google</h1><p>Tap atau scan kartu untuk memulai.</p>`);
    return;
  }
  const code = decodeURIComponent(parts[1]).toUpperCase();
  if (parts[2] === "edit") return editor(code);
  try {
    const rows = await rpc("get_card", { p_code: code });
    if (!rows.length) return show(`<h1>Kartu tidak valid</h1><p>Kode kartu ini tidak ditemukan.</p>`);
    const card = rows[0];
    if (card.active && validUrl(card.review_url)) return go(card.review_url);
    activation(code);
  } catch (err) {
    show(`<h1>Terjadi kendala</h1><p class="err">${err.message}. Coba scan ulang.</p>`);
  }
}
route();
</script>
</body>
</html>
